<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Fidget Spinner | Tappy</title>
    <meta name="robots" content="noindex, follow">
    <meta name="color-scheme" content="light">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
    <link rel="preload" href="/assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/fonts/nunito.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=20261109">
    <link rel="stylesheet" href="/assets/css/fidgets.css?v=20261113">
</head>
<body class="embed">
    <main class="embed-main">
        <article class="pg-card" data-fidget="spinner">
            <header class="pg-head">
                <div class="pg-stats">
                    <span class="pg-stat"><b data-rpm>0</b> RPM</span>
                    <span class="pg-stat">Best <b data-best-rpm>0</b></span>
                </div>
            </header>
            <div class="pg-screen pg-spin" aria-label="Fidget spinner: drag in a circle to spin" role="img">
                <img class="spinner-img" src="/assets/v6/fidgets/spinner.webp" width="420" height="420" alt="" draggable="false">
                <img class="spinner-face" src="/assets/v6/stickers/tappy-face.webp" width="320" height="320" alt="" draggable="false">
                <p class="pg-hint">Flick it to spin</p>
            </div>
        </article>
        <div class="embed-bar">
            <a href="https://www.tappy.net/fidgets/" target="_blank" rel="noopener"><img src="/assets/v6/logo-dark.webp" width="322" height="120" alt="Tappy">More free fidgets</a>
            <button class="pg-toggle" type="button" data-sound-toggle aria-pressed="true">Sound <b>On</b></button>
        </div>
    </main>
    <script src="/assets/js/fidgets.js?v=20261113d" defer></script>
</body>
</html>
